services:
  - type: web
    name: radiocontinental99-7
    runtime: static
    buildCommand: npm ci --include=dev && npm run deploy:prepare
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /noticias
        destination: /index.html
      - type: rewrite
        source: /programas
        destination: /index.html
      - type: rewrite
        source: /programacion
        destination: /index.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: /index.html
      - type: rewrite
        source: /buscar
        destination: /index.html
      - type: rewrite
        source: /en-vivo
        destination: /index.html
      - type: rewrite
        source: /contacto
        destination: /index.html
      - type: rewrite
        source: /nosotros
        destination: /index.html
      - type: rewrite
        source: /deportes
        destination: /index.html
      - type: rewrite
        source: /privacidad
        destination: /index.html
      - type: rewrite
        source: /terminos
        destination: /index.html
